# Copy to inventory.ini (git-ignored). Hosts are Tailscale MagicDNS names,
# so Ansible works from anywhere you're on the tailnet (Tailscale SSH handles auth).

[core]
core-pc

[nodes]
media-pc
ai-pc

[homelab:children]
core
nodes

[homelab:vars]
ansible_user=jaime
ansible_python_interpreter=/usr/bin/python3
# Keeps LAN access through the firewall (Plex clients on TVs, etc.). Leave empty to block LAN.
allow_lan_cidr=192.168.1.0/24
