# llama.cpp server behind its own tunnel (docs/llama-cpp.md). /health answers {"status":"ok"}.
endpoints:
  - name: AI API
    group: websites
    enabled: false                        # tunnel ailabs-llama-cpp was down (530) on 2026-10-31; enable once it's back
    url: https://api.${DOMAIN}/health
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: ntfy
