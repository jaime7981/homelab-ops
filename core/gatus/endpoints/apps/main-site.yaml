endpoints:
  - name: Main site
    group: websites
    url: https://${DOMAIN}
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"
      - "[BODY] == pat(*AI Labs*)"          # in the page title; catches error pages served with 200
    alerts:
      - type: ntfy
